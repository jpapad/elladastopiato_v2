<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Χάρτης — έλεγχος production bundle</title>
    <!-- Ανοίγει με `npm run wp-map:dev` → http://localhost:5178/preview-build.html (μετά από wp-map:build) -->
    <style>
      html {
        font-size: 62.5%;
      }
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f4efe6;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 4rem 1.6rem;
      }
      button {
        background: hotpink;
        padding: 2rem;
        border: 4px solid blue;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Production bundle (όπως φορτώνεται από το plugin)</h1>
      <!-- Ίδιο markup με το shortcode, χωρίς data-geo: ο φάκελος geo/ βρίσκεται αυτόματα δίπλα στο js/ -->
      <div data-ellada-map data-api="/wp-json/" data-title="Εξερεύνηση"></div>
    </main>
    <script src="/wordpress-plugin/ellada-map/assets/js/ellada-map.js" defer></script>
  </body>
</html>
